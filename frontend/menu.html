<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Food and Food</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo" onclick="location.reload()" style="cursor: pointer; font-size: 2.2rem;">🥘</div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="app-header">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                    <div>
                        <div id="table-indicator-badge" style="background: linear-gradient(135deg, #FF4D00, #FF8533); color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(255, 77, 0, 0.25); margin-bottom: 8px;">
                            <span>🪑</span>
                            <span id="current-table-label">Table 1</span>
                        </div>
                        <h1 style="margin: 0;">Welcome to Food and Food</h1>
                        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 2px;">What would you like to eat today?</p>
                    </div>
                    <div id="menu-wait-time" style="background: #FFF5F5; color: #FF4D00; padding: 6px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; border: 1px solid #FED7D7; display: flex; align-items: center; gap: 5px;">
                        <span>🕒</span>
                        <span>Wait: ~10 mins</span>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="color: var(--text-muted)">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" placeholder="Search for food..." onkeyup="searchMenu(this.value)">
                    </div>
                    <div class="icon-btn" onclick="goToCart()">
                        🛒
                        <span id="cart-count"
                            style="position: absolute; top: -5px; right: -5px; background: var(--primary); color: white; font-size: 0.65rem; padding: 2px 5px; border-radius: 50%; font-weight: 800; display: none;">0</span>
                    </div>
                </div>
            </header>

            <!-- Table Active Session Running Bill Bar -->
            <div id="table-running-bar" style="display: none; background: #ECFDF5; border: 1.5px solid #A7F3D0; color: #065F46; padding: 12px 18px; border-radius: 16px; margin-bottom: 20px; justify-content: space-between; align-items: center; font-size: 0.95rem; box-shadow: var(--shadow-sm);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 1.3rem;">🧾</span>
                    <span>Ordering for <strong id="table-bar-number">Table 1</strong> &bull; Current Bill: <strong id="table-running-amount" style="color: #047857; font-size: 1.1rem;">₹0</strong></span>
                </div>
                <span style="font-size: 0.75rem; background: #10B981; color: white; padding: 4px 10px; border-radius: 20px; font-weight: 800; letter-spacing: 0.5px;">ACTIVE SESSION</span>
            </div>

            <!-- Top Selling Today Section -->
            <div id="top-selling-section" class="card mb-4" style="background: linear-gradient(135deg, #1E293B 0%, #334155 100%); color: white; border: none; box-shadow: var(--shadow-lg); padding: 18px 20px; margin-bottom: 20px;">
                <h3 class="font-bold mb-3" style="font-size: 1.05rem; color: white; display: flex; align-items: center; gap: 8px;">
                    <span>🔥</span> Top Selling Today
                </h3>
                <div id="top-items-list" style="display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none;">
                    <span style="font-size: 0.85rem; opacity: 0.7;">Loading top sellers...</span>
                </div>
            </div>

            <!-- Categories -->
            <div class="category-scroll" id="category-tabs">
                <!-- Categories will be rendered dynamically -->
            </div>

            <div class="quick-filter-bar" id="quick-filter-bar">
                <button type="button" class="quick-filter active" data-filter="all" onclick="setMenuQuickFilter('all', this)">All</button>
                <button type="button" class="quick-filter" data-filter="veg" onclick="setMenuQuickFilter('veg', this)">Veg</button>
                <button type="button" class="quick-filter" data-filter="nonveg" onclick="setMenuQuickFilter('nonveg', this)">Non-Veg</button>
                <button type="button" class="quick-filter" data-filter="under200" onclick="setMenuQuickFilter('under200', this)">Under ₹200</button>
                <button type="button" class="quick-filter" data-filter="popular" onclick="setMenuQuickFilter('popular', this)">Popular</button>
            </div>

            <!-- Menu Grid -->
            <div class="menu-grid" id="menu-container">
                <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
                    <div class="spinner" style="margin: 0 auto;"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="cart-float" class="cart-float" style="display: none;" onclick="goToCart()"></div>

    <div id="item-detail-overlay" class="item-detail-overlay" onclick="if(event.target === this) closeItemDetail()">
        <div class="item-detail-modal" id="item-detail-modal"></div>
    </div>

    <!-- Smart Suggestions Overlay -->
    <div id="suggestion-overlay" class="suggestion-overlay" onclick="if(event.target === this) closeSuggestions()">
        <div class="suggestion-card">
            <h3>Better Together! 🤩</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Customers also ordered these:
            </p>
            <div id="suggestion-list"></div>
            <button class="btn btn-outline" onclick="closeSuggestions()"
                style="margin-top:10px; border:none; color:var(--primary);">No thanks, I'm good</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadMenu();
            updateCartUI();
        });
    </script>
</body>

</html>
