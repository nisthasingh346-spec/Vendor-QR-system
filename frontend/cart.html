<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Food and Food</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="logo" onclick="goBackToMenu()" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Menu</span>
        </div>
        <div id="cart-table-badge" style="background: linear-gradient(135deg, #FF4D00, #FF8533); color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 800; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(255, 77, 0, 0.2);">
            <span>🪑</span>
            <span id="cart-table-label">Table 1</span>
        </div>
    </header>

    <div class="container animate-fade-in mb-4">
        <h1 class="mb-2 font-extrabold">My Cart</h1>

        <div id="cart-items-container">
            <!-- Cart items will be loaded here -->
        </div>

        <div id="empty-cart" class="text-center p-4 mt-4" style="display: none;">
            <div style="font-size: 4rem;" class="mb-2">🛒</div>
            <h2 class="mb-1">Your cart is empty</h2>
            <p class="text-muted mb-2">Add some tasty street food to get started!</p>
            <button class="btn btn-primary" onclick="goBackToMenu()">Browse Menu</button>
        </div>

        <div id="cart-summary" class="mt-2" style="display: none;">
            <div class="card p-2">
                <div class="flex justify-between mb-1 text-muted">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="flex justify-between mb-2 font-extrabold"
                    style="font-size: 1.2rem; border-top: 1px dashed #DDD; padding-top: 10px;">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>

                <h3 class="mb-1" style="font-size: 1rem;">Payment Method</h3>
                <div class="payment-methods">
                    <div class="method-card active" id="method-cash" onclick="selectPayment('Cash')">
                        <div style="font-size: 1.5rem;" class="mb-1">💵</div>
                        <div style="font-weight: 600; font-size: 0.9rem;">Cash</div>
                    </div>
                    <div class="method-card" id="method-upi" onclick="selectPayment('UPI')">
                        <div style="font-size: 1.5rem;" class="mb-1">📱</div>
                        <div style="font-weight: 600; font-size: 0.9rem;">UPI</div>
                    </div>
                </div>

                <div class="mb-2 p-2 bg-white"
                    style="border-radius: 12px; border: 1px dashed #E2E8F0; background: #F8FAFC !important;">
                    <p style="font-size: 0.85rem;" class="text-muted text-center">
                        Orders paid via <strong>Cash</strong> are placed immediately.<br>
                        <strong>UPI</strong> orders will lead to a secure payment page.
                    </p>
                </div>

                <button class="btn btn-primary" id="place-order-btn" onclick="placeOrder()">
                    Confirm & Place Order
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
        });
    </script>
</body>

</html>
